# Render Blueprint — https://render.com/docs/blueprint-spec
# After connecting GitHub, use "New > Blueprint" or set env vars manually in the dashboard.

services:
  - type: web
    name: fbr-integration
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /users/sign_in
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: FBR_SANDBOX_TOKEN
        sync: false
      - key: APP_HOST
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: MAILER_FROM
        value: noreply@integrontechnologies.com
      - key: SUPPORT_EMAIL
        value: support@integrontechnologies.com
